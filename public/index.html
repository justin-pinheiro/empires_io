<!DOCTYPE html>
<html>
<head>
    <title>Hex Empire MVP</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <div class="top-center-group">
            <div id="resources-panel">
                Tiles: <span id="tilesVal">0</span>/<span id="populationVal">0</span> |
                Food: <span id="foodVal">0</span> | 
                Gold: <span id="goldVal">0</span> | 
                Stone: <span id="stoneVal">0</span> | 
                Army: <span id="armyVal">0</span>/<span id="militaryVal">0</span>
            </div>
            
            <div id="wave-panel">
                Barbarian Wave in: <span id="waveTimer">--s</span>
                <div id="waveBar"><div id="waveBarFill"></div></div>
            </div>
        </div>

        <div class="bottom-center-group">
            <div id="troopPanel" style="pointer-events: auto; display:flex; gap:8px; align-items:center;">
                <button class="troop-btn active" onclick="setTroopCount(this, 1)">*1</button>
                <button class="troop-btn" onclick="setTroopCount(this, 10)">*10</button>
                <button class="troop-btn" onclick="setTroopCount(this, 50)">*50</button>
            </div>
            <div id="buildMenu">
                <button class="build-btn active" onclick="setBuildType(this, 'FARM')">Farm</button>
                <button class="build-btn" onclick="setBuildType(this, 'MARKET')">Market</button>
                <button class="build-btn" onclick="setBuildType(this, 'MINE')">Mine</button>
                <button class="build-btn" onclick="setBuildType(this, 'HOUSE')">House</button>
                <button class="build-btn" onclick="setBuildType(this, 'CAMP')">Camp</button>
                <button class="build-btn" onclick="setBuildType(this, 'TOWER')">Tower</button>
            </div>
            <div id="build-panel">
                <div id="buildTimer">Building available in: --s</div>
                <div id="buildBar"><div id="buildBarFill"></div></div>
            </div>
        </div>

        <div id="sidePanel">
            <h3 id="panelTitle">Tile Info</h3>
            <div id="panelContent"></div>
        </div>
    </div>

    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: 'Segoe UI', sans-serif; }
        
        #ui-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Top Center Grouping */
        .top-center-group {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }

        #resources-panel {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 25px;
            border-radius: 30px;
            color: white;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            white-space: nowrap;
            pointer-events: auto;
        }

        #wave-panel, #build-panel {
            color: #ff6b6b;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            text-align: center;
        }

        #build-panel {
            color: #6195ff;
        }

        #waveBar, #buildBar { width: 150px; height: 6px; background: rgba(0,0,0,0.5); border-radius: 3px; margin-top: 4px; overflow: hidden; }
        #waveBarFill { width: 0%; height: 100%; background: #ff6b6b; transition: width 0.1s linear; }
        #buildBarFill { width: 0%; height: 100%; background: #6195ff; transition: width 0.1s linear; }

        /* Bottom Center Grouping */
        .bottom-center-group {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            z-index: 10;
        }

        .build-btn { 
            padding: 12px 18px; 
            cursor: pointer; 
            border: 1px solid #444; 
            background: #1a1a1a; 
            color: white; 
            transition: 0.2s;
            pointer-events: auto;
        }
        .build-btn.active { background: #ffd700; color: black; font-weight: bold; transform: scale(1.1); border-color: white; }

        /* Troop send buttons */
        .troop-btn {
            padding: 8px 12px;
            cursor: pointer;
            border: 1px solid #444;
            background: #1a1a1a;
            color: white;
            transition: 0.15s;
            pointer-events: auto;
        }
        .troop-btn.active { background: #ff6b6b; color: white; font-weight: bold; transform: scale(1.05); border-color: white; }
        
        #buildCooldown {
            background: rgba(0,0,0,0.8);
            color: #00d0ff;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
        }

        /* Side Panel */
        #sidePanel {
            position: fixed;
            right: -260px;
            top: 100px;
            width: 220px;
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 20px;
            transition: right 0.3s ease;
            border-left: 3px solid #ffd700;
            pointer-events: auto;
        }
        #sidePanel.open { right: 0; }
    </style>
    <canvas id="gameCanvas"></canvas>
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
