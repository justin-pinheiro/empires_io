<!DOCTYPE html>
<html>
<head>
    <title>Hex Empire MVP</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="resources">
            Tiles: <span id="tilesVal">0</span>/<span id="populationVal">0</span> (Population) |
            Food: <span id="foodVal">0</span> | 
            Gold: <span id="goldVal">0</span> | 
            Stone: <span id="stoneVal">0</span> | 
            Army: <span id="armyVal">0</span>/<span id="militaryVal">0</span>
        </div>
        <div id="buildMenu">
            <button class="build-btn active" onclick="setBuildType(this, 'farm')">Farm</button>
            <button class="build-btn" onclick="setBuildType(this, 'market')">Market</button>
            <button class="build-btn" onclick="setBuildType(this, 'mine')">Mine</button>
            <button class="build-btn" onclick="setBuildType(this, 'house')">House</button>
            <button class="build-btn" onclick="setBuildType(this, 'camp')">Camp</button>
            <button class="build-btn" onclick="setBuildType(this, 'tower')">Tower</button>
        </div>
    </div>

    <style>
        #ui { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            padding: 15px; 
            background: rgba(0,0,0,0.5); 
            color: white;
            display: flex; 
            justify-content: space-between;
            /* REMOVE pointer-events: none; from here */
            z-index: 10; /* Ensure it stays above the canvas */
        }
        #buildMenu {
            pointer-events: auto; /* Explicitly allow clicking the buttons */
        }
        .build-btn { padding: 10px; cursor: pointer; border: 1px solid #555; background: #222; color: white; }
        .build-btn.active { background: #ffd700; color: black; font-weight: bold; border-color: white; }
    </style>
    <canvas id="gameCanvas"></canvas>
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
